<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy v4 — Player Journey Prototype</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f6f7ff;background:#090b17}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#292057 0,transparent 42%),#090b17;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #70dcff;outline-offset:3px}.app{max-width:500px;margin:auto;min-height:100vh;padding:22px 20px 104px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.logo{font-weight:950;letter-spacing:.14em;font-size:14px}.logo b{color:#a68cff}.player{border:1px solid #505174;border-radius:99px;background:#1d2038;color:#fff;padding:10px 14px;font-size:13px}.kicker{font-size:11px;letter-spacing:.19em;color:#aeb6e3;font-weight:800;text-transform:uppercase}h1{font-size:clamp(36px,9vw,52px);line-height:1.03;letter-spacing:-.06em;margin:12px 0 14px}h2{font-size:28px;letter-spacing:-.04em;margin:8px 0 13px}p{color:#bfc5df;line-height:1.5}.hero{background:linear-gradient(135deg,#28266b,#171b38 68%);border:1px solid #5d54a2;border-radius:28px;padding:25px;margin:25px 0;position:relative;overflow:hidden}.hero:after{content:'↗';position:absolute;font-size:150px;right:-18px;bottom:-75px;color:#ffffff0d}.hero h2{font-size:32px;max-width:290px}.hero p{max-width:290px}.pill{display:inline-block;border:1px solid #7772bd;color:#d6d0ff;border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800}.cta{display:block;width:100%;border:0;background:#a88bff;color:#11112b;border-radius:16px;padding:17px 18px;font-weight:900;text-align:center;margin-top:20px;position:relative;z-index:1}.cta.secondary{background:#272c4d;color:#fff;border:1px solid #545b8d}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:24px 0}.mini div{background:#191d34;border:1px solid #323751;border-radius:15px;padding:14px 10px;font-size:12px;color:#aeb8d7}.mini b{display:block;font-size:21px;color:#fff;margin-bottom:3px}.section{font-size:12px;color:#aab4d5;letter-spacing:.15em;font-weight:850;text-transform:uppercase;margin:25px 0 12px}.route{display:flex;align-items:center;gap:14px;width:100%;background:#171b31;border:1px solid #333954;color:white;text-align:left;padding:17px;border-radius:18px;margin:9px 0}.route .num{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#34316c;color:#c6baff;font-weight:900;flex:none}.route b{display:block;font-size:17px}.route small{display:block;color:#aeb6d1;margin-top:4px}.route .arrow{margin-left:auto;font-size:24px;color:#b2a5fa}.hidden{display:none!important}.back{border:0;background:transparent;color:#bfb6ff;font-weight:800;padding:10px 0 25px}.step{display:flex;gap:7px;margin:20px 0}.step span{height:5px;flex:1;border-radius:10px;background:#32374d}.step span.on{background:#a88bff}.field{background:#102a24;border:2px solid #538b70;border-radius:17px;padding:12px;aspect-ratio:1.3;position:relative;overflow:hidden}.field:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,#ffffff33 50%,transparent 50.3%);pointer-events:none}.field svg{width:100%;height:100%;display:block}.field line,.field path{stroke:#ffffff88;fill:none;stroke-width:2}.field .pass{stroke:#f5d45b;stroke-width:4;stroke-dasharray:7 6}.field .run{stroke:#8ee8ff;stroke-width:4;stroke-dasharray:5 6}.field text{font-size:12px;font-weight:900;fill:#fff}.question{font-size:22px;font-weight:850;line-height:1.25;margin:24px 0 15px}.choice{width:100%;border:1px solid #43496b;background:#1a1f38;color:#fff;padding:16px;border-radius:14px;margin:6px 0;text-align:left;font-weight:750}.choice.selected{border-color:#bba8ff;background:#363064}.feedback{background:#20294a;border-left:4px solid #a88bff;padding:17px;border-radius:12px;margin-top:18px}.card{border:1px solid #353b5b;background:#191d33;border-radius:20px;padding:20px;margin:17px 0}.card strong{font-size:20px}.tag{font-size:12px;color:#b9afff;font-weight:850;letter-spacing:.1em}.check{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:#222743;color:#fff;border:1px solid #454c74;border-radius:14px;padding:17px;margin:10px 0;text-align:left}.check.done{border-color:#75d9b4;background:#173b35}.footer{position:fixed;bottom:0;left:0;right:0;background:#0c0e1df2;border-top:1px solid #292e48;display:flex;justify-content:center;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom))}.footer button{background:transparent;border:0;color:#929ab7;padding:10px 13px;border-radius:11px;font-weight:800;font-size:12px}.footer button.active{background:#302a62;color:#fff}.notice{font-size:12px;color:#9ea8c8;margin-top:18px}
</style></head><body><main class="app"><header class="top"><div class="logo">GALAXY <b>TRAINING</b></div><button class="player" id="player" type="button">Jay ▾</button></header><div id="view"></div><p class="notice">Interactive design prototype · One winger development journey · Stored on this device only.</p></main><nav class="footer" aria-label="Primary navigation"><button data-nav="home" class="active">Today</button><button data-nav="learn">Learn</button><button data-nav="drills">Drills</button><button data-nav="workout">Workout</button></nav>
<script>
(function(){'use strict';const KEY='galaxy-v4-journey-prototype';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};let player=state.player||'Jay',page='home',step=0,choice=-1;const root=document.getElementById('view');function saved(){localStorage.setItem(KEY,JSON.stringify(state))}function record(){return state[player]||(state[player]={})}function done(k){return !!record()[k]}function tick(k){record()[k]=!record()[k];saved();render()}function go(p){page=p;step=0;choice=-1;render();window.scrollTo(0,0)}function button(k,label){return '<button class="check '+(done(k)?'done':'')+'" data-check="'+k+'"><span>'+label+'</span><b>'+(done(k)?'✓':'○')+'</b></button>'}function pitch(){return '<div class="field" role="img" aria-label="Winger in purple on right touchline, defender in red, teammate in blue inside. Blue dashed line indicates a run into space and yellow dashed line a passing option."><svg viewBox="0 0 320 235"><rect x="8" y="8" width="304" height="219" rx="2" fill="none" stroke="#ffffff66" stroke-width="2"/><rect x="8" y="55" width="53" height="125" fill="none" stroke="#ffffff55"/><circle cx="160" cy="118" r="43" fill="none" stroke="#ffffff55"/><path class="run" d="M265 172 Q282 118 270 66"/><path class="pass" d="M251 182 L169 126"/><circle cx="251" cy="182" r="15" fill="#8964ff" stroke="#fff" stroke-width="2"/><text x="247" y="187">W</text><circle cx="220" cy="123" r="15" fill="#ed696d" stroke="#fff" stroke-width="2"/><text x="216" y="128">D</text><circle cx="169" cy="126" r="15" fill="#4c9aff" stroke="#fff" stroke-width="2"/><text x="165" y="131">8</text><circle cx="246" cy="198" r="4" fill="#f4d45b"/></svg></div>'}function home(){return '<div class="kicker">Your next session</div><h1>Play smarter.<br>Move better.</h1><p>One clear focus for today. Learn the decision, train the skill, then take it into your next match.</p><section class="hero"><span class="pill">WINGER PATH · SESSION 01</span><h2>Know when to attack space</h2><p>Read the defender. Choose whether to drive forward or combine inside.</p><button class="cta" data-go="learn">Start today’s session →</button></section><div class="mini"><div><b>'+(done('decision')?'1':'0')+'/1</b>Game IQ</div><div><b>'+['drill1','drill2'].filter(done).length+'/2</b>Drills</div><div><b>'+['move1','move2','move3'].filter(done).length+'/3</b>Movement</div></div><div class="section">Your development route</div>'+route('learn','01','Read the defender','Interactive decision, not a lecture')+route('drills','02','Train the first touch','Two linked field drills')+route('workout','03','Build the movement','Three reference exercises')+'<div class="section">Match application</div>'+button('match','I tried attacking space at practice') }function route(id,n,title,desc){return '<button class="route" data-go="'+id+'"><span class="num">'+n+'</span><span><b>'+title+'</b><small>'+desc+'</small></span><span class="arrow">›</span></button>'}function learn(){const options=['Drive at the defender immediately','Check the defender’s hips and the inside support','Stop and wait for instructions'];return '<button class="back" data-go="home">← Today’s session</button><div class="kicker">01 / Game IQ · Winger</div><h1>Read the space.</h1><p>The ball is at your feet near the touchline. A defender is closing down. Your midfielder is available inside.</p>'+pitch()+'<div class="step">'+[0,1,2].map((n)=>'<span class="'+(n<=step?'on':'')+'"></span>').join('')+'</div>'+(step===0?'<div class="question">What should you look at before your next touch?</div>'+options.map((x,i)=>'<button class="choice '+(choice===i?'selected':'')+'" data-choice="'+i+'">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+'<button class="cta" data-next '+(choice<0?'disabled':'')+'>Check my decision →</button>':step===1?'<div class="question">'+(choice===1?'That’s the read.':'Consider the defender and your support.')+'</div><div class="feedback"><b>Look first, then commit.</b><p>If the defender closes the line, combine inside. If their hips turn inward and the channel opens, push into space. Don’t decide before you scan.</p></div><button class="cta" data-next>Take it to the field →</button>':'<div class="question">Your challenge</div><p>At your next practice, identify the defender’s body shape before receiving. Try one purposeful run down the line and one combination inside.</p>'+button('decision','I understand the winger decision')+'<button class="cta" data-go="drills">Train this skill →</button>')}function drills(){return '<button class="back" data-go="home">← Today’s session</button><div class="kicker">02 / Field work · 12 minutes</div><h1>Make the read real.</h1><p>Two simple drills that connect directly to the winger decision. Use a ball, four cones, and a wall or partner.</p><div class="card"><span class="tag">DRILL 01 · 6 MIN · SOLO</span><h2>Open body, first touch</h2><p>Set two cone gates left and right, 3–4 steps apart. Pass against a wall. Scan over your shoulder before the return, then take your first touch through the open gate. Alternate sides.</p><p><b>Target:</b> 3 sets of 8 controlled receptions. Rest 30 seconds between sets.</p>'+button('drill1','Completed controlled receptions')+'</div><div class="card"><span class="tag">DRILL 02 · 6 MIN · PARTNER</span><h2>Line or inside?</h2><p>A partner stands as a passive defender. Approach with the ball; they show either the touchline or inside route. Recognize the space, then take two quick touches into it.</p><p><b>Target:</b> 3 rounds of 6 decisions. Switch defender cues each repetition.</p>'+button('drill2','Completed decision repetitions')+'</div><button class="cta" data-go="workout">Build the movement →</button>'}function workout(){return '<button class="back" data-go="home">← Today’s session</button><div class="kicker">03 / Movement · Reference only</div><h1>Move with control.</h1><p>Three sample exercises illustrate the connected journey. This is not a replacement for the full 8–12 movement plan in v3.</p><div class="card"><span class="tag">CONTROL</span><h2>Supported split squat</h2><p>2 × 6 each leg. Lower slowly with a hand on a stable support. Knee tracks over foot.</p>'+button('move1','Completed split squats')+'</div><div class="card"><span class="tag">BALANCE</span><h2>Single-leg balance</h2><p>2 × 20 seconds per leg. Keep your gaze steady and knee soft. Use a wall as needed.</p>'+button('move2','Completed balance sets')+'</div><div class="card"><span class="tag">ANKLE STRENGTH</span><h2>Calf raise</h2><p>2 × 12. Rise, pause, and lower slowly. No bouncing.</p>'+button('move3','Completed calf raises')+'</div><button class="cta" data-go="home">Review my session →</button>'}function render(){root.innerHTML=page==='home'?home():page==='learn'?learn():page==='drills'?drills():workout();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));document.getElementById('player').textContent=player+' ▾'}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='player'){player=player==='Jay'?'James':'Jay';state.player=player;saved();render();return}if(b.dataset.nav)go(b.dataset.nav);else if(b.dataset.go)go(b.dataset.go);else if(b.dataset.check)tick(b.dataset.check);else if(b.dataset.choice!==undefined){choice=Number(b.dataset.choice);render()}else if(b.hasAttribute('data-next')){if(step===0&&choice<0)return;step=Math.min(2,step+1);render()}});render()})();
</script></body></html>
